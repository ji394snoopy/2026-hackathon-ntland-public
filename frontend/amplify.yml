version: 1

frontend:
  phases:
    preBuild:
      commands:
        - corepack enable
        - corepack prepare pnpm@10.15.0 --activate
        - pnpm --version
        - pnpm install --frozen-lockfile

    build:
      commands:
        - pnpm run build

  artifacts:
    baseDirectory: dist
    files:
      - "**/*"

  cache:
    paths:
      - node_modules/**/*
      - .pnpm-store/**/*
